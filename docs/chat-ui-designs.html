<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attaché 对话页设计稿</title>
<style>
:root {
  --wall: radial-gradient(120% 90% at 15% 20%, #f2a35e 0%, #e0773f 30%, transparent 55%),
          radial-gradient(90% 80% at 80% 75%, #f5c46b 0%, #e8954a 35%, transparent 60%),
          radial-gradient(60% 50% at 40% 60%, #6f8fcf 0%, #5b7cc4 40%, transparent 70%),
          linear-gradient(135deg, #f0b36a, #d9673a 60%, #c4503a);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  background: #1b1b1f; color: #eee; -webkit-font-smoothing: antialiased;
}
.bar {
  position: sticky; top: 0; z-index: 10; display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
  padding: 12px 20px; background: #111214ee; backdrop-filter: blur(12px); border-bottom: 1px solid #2a2b30;
}
.bar h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; }
.seg { display: inline-flex; background: #26272c; border-radius: 8px; padding: 2px; }
.seg button {
  border: 0; background: transparent; color: #bbb; font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer;
}
.seg button.on { background: #45464e; color: #fff; }
.desc { padding: 16px 20px 0; max-width: 1320px; margin: 0 auto; color: #c9c9cf; }
.desc b { color: #fff; }
.desc ul { margin: 6px 0 0; padding-left: 18px; }
.stage { padding: 18px 20px 40px; display: flex; justify-content: center; }
.desk {
  width: 1320px; max-width: 100%; height: 840px; border-radius: 14px; background: var(--wall);
  padding: 34px; display: flex;
}
.win {
  flex: 1; display: flex; border-radius: 12px; overflow: hidden; position: relative;
  box-shadow: 0 30px 70px rgba(0,0,0,.35), 0 0 0 .5px rgba(0,0,0,.35);
}
.lights { position: absolute; top: 14px; left: 16px; display: flex; gap: 8px; z-index: 5; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
code, .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 11.5px; }

/* ---------- theme tokens ---------- */
.light { --bg: #f7f6f4; --bg2: #efede9; --rail: rgba(246,240,234,.62); --text: #1f2023; --mute: #6b6d73; --faint: #9a9ca2;
  --line: rgba(0,0,0,.09); --card: #ffffff; --accent: #2f6fde; --accentSoft: rgba(47,111,222,.12); --field: #ffffff;
  --ok: #2f9e5b; --warn: #d97a17; --bad: #d64545; --code: rgba(0,0,0,.05); --glass: rgba(250,247,243,.72); }
.dark { --bg: #1f2024; --bg2: #18191c; --rail: rgba(34,34,40,.62); --text: #e8e8ea; --mute: #a2a3a9; --faint: #74767d;
  --line: rgba(255,255,255,.08); --card: #2a2b30; --accent: #5b8ef0; --accentSoft: rgba(91,142,240,.18); --field: #2b2c31;
  --ok: #4cc27c; --warn: #f0a24b; --bad: #f06a6a; --code: rgba(255,255,255,.07); --glass: rgba(30,30,36,.72); }

/* ---------- shared rail ---------- */
.rail { width: 264px; flex: none; padding: 46px 10px 12px; color: var(--text); display: flex; flex-direction: column; gap: 2px; }
.rail .host { font-size: 10.5px; letter-spacing: .08em; color: var(--mute); font-weight: 600; padding: 4px 10px 6px; }
.rail .sess { font-size: 11px; letter-spacing: .06em; color: var(--mute); font-weight: 600; padding: 8px 10px 4px; display: flex; gap: 6px; align-items: center; }
.rail .row { display: grid; grid-template-columns: 16px 1fr auto; gap: 2px 6px; padding: 7px 10px; border-radius: 8px; }
.rail .row .n { color: var(--faint); font-size: 11px; padding-top: 1px; }
.rail .row .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail .row .s { font-size: 11px; color: var(--mute); grid-column: 2 / 4; }
.rail .row.sel { background: var(--accent); color: #fff; }
.rail .row.sel .n, .rail .row.sel .s, .rail .row.sel .st { color: rgba(255,255,255,.85); }
.st { font-size: 10.5px; display: flex; align-items: center; gap: 5px; color: var(--mute); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--faint); }
.dot.needs { background: var(--warn); } .dot.working { background: var(--accent); } .dot.done { background: var(--ok); }
.rail .foot { margin-top: auto; display: flex; gap: 8px; }
.rail .foot span { flex: 1; text-align: center; padding: 6px; border-radius: 7px; background: var(--line); font-size: 12px; color: var(--mute); }

/* ---------- shared chat bits ---------- */
.md p { margin: 0 0 8px; } .md p:last-child { margin: 0; }
.md ul { margin: 4px 0 8px; padding-left: 20px; } .md li { margin: 2px 0; }
.md code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
.md b { font-weight: 600; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 7px; padding: 4px 11px; font: inherit; font-size: 12px; cursor: default; }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.warn { color: var(--warn); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: var(--code); font-size: 11px; color: var(--mute); }
.spark { color: var(--warn); }
.kbd { font-size: 10.5px; color: var(--faint); }
.approval .subject { font-family: "SF Mono", ui-monospace, monospace; font-size: 11.5px; background: var(--code); padding: 8px 10px; border-radius: 7px; margin: 6px 0 10px; }
.approval .q { font-weight: 600; margin-bottom: 8px; }
.approval .opts { display: flex; flex-direction: column; gap: 6px; }
.approval .opt { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); }
.approval .opt .k { width: 18px; height: 18px; border-radius: 5px; background: var(--code); display: inline-grid; place-items: center; font-size: 11px; color: var(--mute); }
.approval .opt .risk { margin-left: auto; font-size: 11px; color: var(--warn); }

/* ===== V1 统一玻璃：整窗同一层磨砂，消息落在实色卡片上 ===== */
.v1 .win { background: var(--glass); backdrop-filter: blur(30px) saturate(1.4); }
.v1 .rail { background: transparent; border-right: 1px solid var(--line); }
.v1 .main { flex: 1; display: flex; flex-direction: column; min-width: 0; color: var(--text); }
.v1 .head { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 18px; }
.v1 .head .ttl { font-weight: 600; }
.v1 .head .meta { color: var(--mute); font-size: 11.5px; }
.v1 .head .sp { flex: 1; }
.v1 .scroll { flex: 1; overflow: hidden; padding: 4px 0 0; }
.v1 .col { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; padding: 0 24px; }
.v1 .card { background: var(--card); border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 .5px var(--line); }
.v1 .user { align-self: flex-end; max-width: 78%; background: var(--accent); color: #fff; border-radius: 14px 14px 4px 14px; padding: 8px 12px; }
.v1 .queued { align-self: flex-end; font-size: 10.5px; color: var(--mute); margin-top: -8px; }
.v1 .tools { background: var(--card); border-radius: 12px; box-shadow: 0 0 0 .5px var(--line); overflow: hidden; }
.v1 .tools .sum { padding: 9px 14px; display: flex; gap: 8px; color: var(--mute); font-size: 12px; border-bottom: 1px solid var(--line); }
.v1 .tools .step { padding: 6px 14px; display: flex; gap: 8px; font-size: 12px; }
.v1 .tools .step .ok { color: var(--ok); } .v1 .tools .step b { font-weight: 600; }
.v1 .think { color: var(--mute); font-style: italic; padding: 0 4px; }
.v1 .dock { padding: 10px 24px 16px; }
.v1 .dock .col { gap: 8px; padding: 0; }
.v1 .working { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--mute); }
.v1 .working .sp { flex: 1; }
.v1 .field { display: flex; gap: 8px; align-items: flex-end; background: var(--card); border-radius: 14px; padding: 9px 9px 9px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.08), 0 0 0 .5px var(--line); }
.v1 .field .ph { flex: 1; color: var(--faint); padding-bottom: 4px; }
.v1 .send { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 14px; }

/* ===== V2 文档式：整窗实色，像「备忘录 / 邮件」，工具步骤折叠成一行 ===== */
.v2 .win { background: var(--bg); }
.v2 .rail { background: var(--bg2); border-right: 1px solid var(--line); }
.v2 .main { flex: 1; display: flex; flex-direction: column; min-width: 0; color: var(--text); }
.v2 .head { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--line); }
.v2 .head .ttl { font-weight: 600; font-size: 13.5px; }
.v2 .head .sp { flex: 1; }
.v2 .seg2 { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; font-size: 12px; }
.v2 .seg2 span { padding: 3px 10px; color: var(--mute); } .v2 .seg2 span.on { background: var(--code); color: var(--text); font-weight: 500; }
.v2 .scroll { flex: 1; overflow: hidden; padding-top: 18px; }
.v2 .col { max-width: 720px; margin: 0 auto; padding: 0 28px; display: flex; flex-direction: column; gap: 16px; }
.v2 .turn-user { display: flex; gap: 10px; }
.v2 .av { width: 22px; height: 22px; border-radius: 6px; flex: none; display: grid; place-items: center; font-size: 11px; font-weight: 600; }
.v2 .av.me { background: var(--code); color: var(--mute); } .v2 .av.cl { background: #d97757; color: #fff; }
.v2 .who { font-size: 11.5px; font-weight: 600; color: var(--mute); margin-bottom: 2px; }
.v2 .fold { display: inline-flex; gap: 8px; align-items: center; color: var(--mute); font-size: 12px; padding: 4px 0; }
.v2 .fold .ch { font-size: 9px; }
.v2 .think { color: var(--mute); font-size: 12.5px; border-left: 2px solid var(--line); padding-left: 10px; }
.v2 .dock { border-top: 1px solid var(--line); padding: 12px 0 14px; background: var(--bg); }
.v2 .dock .col { gap: 10px; }
.v2 .working { font-size: 12px; color: var(--mute); display: flex; align-items: center; gap: 8px; }
.v2 .working .sp { flex: 1; }
.v2 .field { border: 1px solid var(--line); border-radius: 10px; background: var(--field); padding: 10px 12px 8px; }
.v2 .field .ph { color: var(--faint); min-height: 36px; }
.v2 .field .tb { display: flex; gap: 8px; align-items: center; color: var(--faint); font-size: 11.5px; }
.v2 .field .tb .sp { flex: 1; }

/* ===== V3 卡片悬浮：对话页是一张浮在玻璃窗上的圆角卡片，和终端的 pane 卡片一致 ===== */
.v3 .win { background: var(--glass); backdrop-filter: blur(30px) saturate(1.4); }
.v3 .rail { background: transparent; }
.v3 .main { flex: 1; display: flex; padding: 10px 10px 10px 0; min-width: 0; }
.v3 .sheet { flex: 1; display: flex; flex-direction: column; background: var(--bg); border-radius: 12px; color: var(--text);
  box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px var(--line); overflow: hidden; min-width: 0; }
.v3 .head { display: flex; align-items: center; gap: 10px; padding: 12px 16px 10px; }
.v3 .head .ttl { font-weight: 600; }
.v3 .head .sp { flex: 1; }
.v3 .tabs { display: flex; gap: 2px; background: var(--code); border-radius: 8px; padding: 2px; font-size: 12px; }
.v3 .tabs span { padding: 3px 10px; border-radius: 6px; color: var(--mute); } .v3 .tabs .on { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.v3 .chips { display: flex; gap: 6px; padding: 0 16px 10px; border-bottom: 1px solid var(--line); }
.v3 .scroll { flex: 1; overflow: hidden; padding-top: 16px; }
.v3 .col { max-width: 740px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 14px; }
.v3 .user { align-self: flex-end; max-width: 80%; background: var(--accentSoft); border-radius: 12px; padding: 8px 12px; }
.v3 .queued { align-self: flex-end; font-size: 10.5px; color: var(--mute); margin-top: -10px; }
.v3 .tl { position: relative; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.v3 .tl::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1.5px; background: var(--line); }
.v3 .tl div { position: relative; color: var(--mute); }
.v3 .tl div::before { content: ""; position: absolute; left: -16px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.v3 .tl b { color: var(--text); font-weight: 600; margin-right: 6px; }
.v3 .think { color: var(--mute); font-style: italic; font-size: 12.5px; }
.v3 .dock { padding: 8px 16px 14px; }
.v3 .dock .col { gap: 8px; padding: 0; }
.v3 .working { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--mute); }
.v3 .working .sp { flex: 1; }
.v3 .field { display: flex; gap: 8px; align-items: center; background: var(--field); border: 1px solid var(--line); border-radius: 22px; padding: 6px 6px 6px 16px; }
.v3 .field .ph { flex: 1; color: var(--faint); }
.v3 .send { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }

/* ===== V4 气泡聊天：像「信息」，双方都有气泡，工具调用是小胶囊 ===== */
.v4 .win { background: var(--bg); }
.v4 .rail { background: var(--rail); backdrop-filter: blur(30px) saturate(1.4); border-right: 1px solid var(--line); }
.v4.light .rail { background: rgba(240,236,231,.9); } .v4.dark .rail { background: rgba(28,28,32,.92); }
.v4 .main { flex: 1; display: flex; flex-direction: column; min-width: 0; color: var(--text); }
.v4 .head { height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 1px solid var(--line); position: relative; }
.v4 .head .ttl { font-weight: 600; font-size: 13px; }
.v4 .head .meta { font-size: 11px; color: var(--mute); display: flex; gap: 6px; align-items: center; }
.v4 .head .right { position: absolute; right: 14px; top: 14px; }
.v4 .scroll { flex: 1; overflow: hidden; padding-top: 14px; }
.v4 .col { max-width: 780px; margin: 0 auto; padding: 0 22px; display: flex; flex-direction: column; gap: 8px; }
.v4 .b { max-width: 74%; padding: 8px 12px; border-radius: 18px; }
.v4 .me { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
.v4 .them { align-self: flex-start; background: var(--card); border-bottom-left-radius: 5px; box-shadow: 0 0 0 .5px var(--line); }
.v4 .pills { align-self: flex-start; display: flex; gap: 6px; flex-wrap: wrap; padding-left: 4px; }
.v4 .pill { font-size: 11px; color: var(--mute); background: var(--code); border-radius: 999px; padding: 2px 9px; }
.v4 .pill .ok { color: var(--ok); }
.v4 .stamp { align-self: center; font-size: 10.5px; color: var(--faint); margin: 6px 0; }
.v4 .queued { align-self: flex-end; font-size: 10.5px; color: var(--mute); }
.v4 .typing { align-self: flex-start; background: var(--card); border-radius: 18px; padding: 8px 12px; box-shadow: 0 0 0 .5px var(--line); color: var(--mute); font-size: 12px; display: flex; gap: 8px; align-items: center; }
.v4 .dock { padding: 10px 22px 14px; border-top: 1px solid var(--line); }
.v4 .dock .col { padding: 0; gap: 8px; }
.v4 .field { display: flex; gap: 8px; align-items: center; }
.v4 .field .in { flex: 1; border: 1px solid var(--line); border-radius: 18px; padding: 6px 14px; color: var(--faint); background: var(--field); }
.v4 .send { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }

/* ===== V5 终端原生：沿用终端配色和等宽字体，和切到终端时无缝 ===== */
.v5 .win { background: var(--glass); backdrop-filter: blur(30px) saturate(1.4); }
.v5 .rail { background: transparent; }
.v5.light { --t-bg: #fbfaf8; --t-fg: #2c2d30; --t-dim: #8a8c92; --t-acc: #c2571f; --t-ok: #2f9e5b; --t-blue: #2f6fde; }
.v5.dark { --t-bg: #16171a; --t-fg: #d7d8dc; --t-dim: #7b7d84; --t-acc: #e8925c; --t-ok: #4cc27c; --t-blue: #7aa2f7; }
.v5 .main { flex: 1; display: flex; padding: 10px 10px 10px 0; min-width: 0; }
.v5 .term { flex: 1; display: flex; flex-direction: column; background: var(--t-bg); color: var(--t-fg); border-radius: 10px; overflow: hidden;
  font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 12.5px; line-height: 1.6; box-shadow: 0 0 0 .5px var(--line); min-width: 0; }
.v5 .head { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px dashed var(--line); font-size: 11.5px; color: var(--t-dim); }
.v5 .head .ttl { color: var(--t-fg); font-weight: 600; }
.v5 .head .sp { flex: 1; }
.v5 .head .tg span { padding: 1px 7px; } .v5 .head .tg .on { color: var(--t-fg); border-bottom: 2px solid var(--t-acc); }
.v5 .scroll { flex: 1; overflow: hidden; padding: 14px 0; }
.v5 .col { max-width: 820px; margin: 0 auto; padding: 0 22px; display: flex; flex-direction: column; gap: 12px; }
.v5 .u { display: flex; gap: 10px; } .v5 .u .p { color: var(--t-acc); font-weight: 700; }
.v5 .u .tx { color: var(--t-fg); background: rgba(127,127,127,.09); padding: 1px 8px; border-radius: 4px; }
.v5 .a { font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13px; line-height: 1.55; padding-left: 20px; }
.v5 .a code { font-size: 11.5px; }
.v5 .tool { padding-left: 20px; color: var(--t-dim); }
.v5 .tool .ok { color: var(--t-ok); } .v5 .tool b { color: var(--t-blue); font-weight: 500; }
.v5 .think { padding-left: 20px; color: var(--t-dim); font-style: italic; font-family: -apple-system, sans-serif; font-size: 12.5px; }
.v5 .dock { padding: 6px 22px 12px; }
.v5 .dock .col { padding: 0; gap: 8px; }
.v5 .working { color: var(--t-acc); font-size: 12px; display: flex; align-items: center; gap: 8px; }
.v5 .working .sp { flex: 1; } .v5 .working .dim { color: var(--t-dim); }
.v5 .field { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 2px; display: flex; gap: 10px; color: var(--t-dim); }
.v5 .field .p { color: var(--t-acc); font-weight: 700; }
.v5 .hint { font-size: 11px; color: var(--t-dim); display: flex; gap: 14px; }
.v5 .approval .opt { background: transparent; border-color: var(--line); }
</style>
</head>
<body>
<div class="bar">
  <h1>Attaché 对话页设计稿</h1>
  <div class="seg" id="ver"></div>
  <div class="seg" id="theme"><button data-v="light" class="on">浅色</button><button data-v="dark">深色</button></div>
  <div class="seg" id="state"><button data-v="working" class="on">正在干活</button><button data-v="needs">需要你回答权限</button></div>
</div>
<div class="desc" id="desc"></div>
<div class="stage"><div class="desk"><div class="win" id="win"></div></div></div>

<script>
const VERSIONS = [
  { id: "v1", name: "1 统一玻璃",
    desc: "<b>思路：</b>整个窗口用同一层磨砂玻璃，左栏和对话页之间没有一实一透的硬边；只有消息内容落在实色卡片上，所以字永远压在实色上，不受壁纸影响。<ul><li>连续的工具调用合成一张卡片，标题写「4 个步骤」</li><li>输入框是一张浮起的卡片，发送是圆形按钮</li><li>最接近现在 app 左栏的玻璃风格</li></ul>" },
  { id: "v2", name: "2 文档式",
    desc: "<b>思路：</b>整窗实色，左栏比右边深一档，像「备忘录」「邮件」那样安静。对话像一篇文档往下读，不用气泡，用头像和名字区分谁在说话。<ul><li>工具调用默认折叠成一行「运行了 4 个步骤」，点开才看细节，页面最干净</li><li>标题栏右边是「对话 / 终端」分段控件</li><li>输入框下面一排小工具：斜杠命令、附图、快捷键提示</li></ul>" },
  { id: "v3", name: "3 悬浮卡片",
    desc: "<b>思路：</b>窗口和左栏保持玻璃，对话页是一张浮在玻璃上的圆角实色卡片，四周留一圈边，和终端打开 pane 卡片时的样子一致，切换对话和终端时外形不变。<ul><li>模型、effort、上下文、缓存做成卡片顶部的小标签</li><li>工具调用画成一条时间线，每一步一个点</li><li>输入框是胶囊形</li></ul>" },
  { id: "v4", name: "4 气泡聊天",
    desc: "<b>思路：</b>像「信息」app：你的消息在右边蓝色气泡，Claude 的回复在左边白色气泡，标题居中。最像聊天软件，手机端用户也最熟悉。<ul><li>工具调用是回复下面的一排小胶囊，不占地方</li><li>正在干活显示成对方「正在输入」的气泡</li><li>长回复放在气泡里会比较窄，读长文不如 1、2 舒服</li></ul>" },
  { id: "v5", name: "5 终端原生",
    desc: "<b>思路：</b>沿用终端的配色和等宽字体，提示符、工具行都像 Claude Code 在终端里画的那样，只有回复正文用正常字体排版。切到终端时几乎没有视觉跳变。<ul><li>你的消息以 ❯ 开头，工具行是暗色的 ⏺ Bash(…)</li><li>输入框就是终端里的那条输入线</li><li>最「工具感」，但对不熟终端的人没那么友好</li></ul>" },
];

const RAIL = [
  { n: 1, t: "pastepaw-win", s: "main · Opus 5.5 · 9%", st: "needs", w: "needs you" },
  { n: 2, t: "Attaché", s: "main · Opus 5.5 · 51%", st: "working", w: "working", sel: true },
  { n: 3, t: "CCSwitcher", s: "main · Sonnet 5.5 · 13%", st: "idle", w: "idle" },
  { n: 4, t: "AnyDrag", s: "main · Sonnet 5.5 · 0%", st: "idle", w: "idle" },
  { n: 5, t: "PastePawX", s: "main · Opus 5.5 · 10%", st: "done", w: "done" },
  { n: 6, t: "QDuo", s: "main · Sonnet 5.5 · 15%", st: "idle", w: "idle" },
  { n: 7, t: "HyperCapslock", s: "main", st: "idle", w: "" },
  { n: 8, t: "Flowy", s: "feat/wake-word · Sonnet 5.5", st: "idle", w: "idle" },
];

const C = {
  title: "Herdr 手机端通信与显示",
  model: "Opus 5.5", effort: "high", ctx: "51%", cache: "cache 59m",
  u1: "这个窗口大小为什么不能拖动呢？不能拖窗口大小。",
  a1: "先确认是哪里卡住了窗口：我用脚本试着改一下窗口大小，看它能不能变。",
  think: "Height changes but width stays at 1260 — something at a priority above the window's 510 is pinning the width…",
  tools: [["Bash", "Try to resize the Attaché window and read its size"], ["Bash", "Lower the column-fill priority; rebuild, restart"], ["Bash", "Test resizing to 1600, 1000, 1400"], ["Read", "win8.png"]],
  a2: `<p>窗口宽度现在可以改了：设成 <b>1600、1000、1400</b> 都生效了。</p><p>原因是对话那一列的宽度规则优先级（750）比拖动窗口（510）还高，把宽度钉死了。改动：</p><ul><li><code>fillColumn</code> 降到 490，低于拖窗口</li><li>打开对话页时直接停在最新的消息上</li></ul>`,
  u2: "这个背景色就不适合用这种透明的效果了，看着会有点奇怪。",
  working: "Building macOS chat mode…", wdetail: "2m 26s · ↓ 5.5k tokens",
  appr: { subject: "git push origin main", q: "Do you want to proceed?", opts: [["Yes", ""], ["Yes, and don't ask again for git push", "以后不再问"], ["No, and tell Claude what to do differently", ""]] },
};

function rail() {
  return `<div class="rail"><div class="host">THIS MAC</div><div class="sess">▸ DAILY</div><div class="sess">▸ VIDEO</div><div class="sess">▾ DEV</div>` +
    RAIL.map(r => `<div class="row ${r.sel ? "sel" : ""}"><span class="n">${r.n}</span><span class="t">${r.t}</span><span class="st">${r.w}<i class="dot ${r.st}"></i></span><span class="s">${r.s}</span></div>`).join("") +
    `<div class="foot"><span>+ Session</span><span>+ Server…</span></div></div>`;
}

function approval(cls = "") {
  const a = C.appr;
  return `<div class="approval ${cls}"><div class="q">${a.q}</div><div class="subject">$ ${a.subject}</div><div class="opts">` +
    a.opts.map((o, i) => `<div class="opt"><span class="k">${i + 1}</span>${o[0]}${o[1] ? `<span class="risk">⚠︎ ${o[1]}，会再确认一次</span>` : ""}</div>`).join("") +
    `</div></div>`;
}

const R = {
  v1(s) {
    const tools = `<div class="tools"><div class="sum">✓ 4 个步骤</div>${C.tools.map(t => `<div class="step"><span class="ok">✓</span><b>${t[0]}</b><span>${t[1]}</span></div>`).join("")}</div>`;
    return rail() + `<div class="main"><div class="head"><span class="ttl">✳ ${C.title}</span><span class="meta">Claude · ${C.model} · ${C.effort} · ctx ${C.ctx}</span><span class="sp"></span><span class="btn">⌘⇧\\ 终端</span></div>
      <div class="scroll"><div class="col">
        <div class="user">${C.u1}</div>
        <div class="card md"><p>${C.a1}</p></div>
        <div class="think">${C.think}</div>
        ${tools}
        <div class="card md">${C.a2}</div>
        <div class="user">${C.u2}</div><div class="queued">在它干活时发出</div>
      </div></div>
      <div class="dock"><div class="col">
        ${s === "needs" ? `<div class="card">${approval()}</div>` :
          `<div class="working"><span class="spark">✻</span>${C.working}<span>${C.wdetail}</span><span class="sp"></span><span class="btn">Stop</span></div>`}
        <div class="field"><span class="ph">${s === "needs" ? "先回答上面的问题" : "给 Claude 发消息"}</span><span class="send">↑</span></div>
      </div></div></div>`;
  },
  v2(s) {
    return rail() + `<div class="main"><div class="head"><span class="ttl">${C.title}</span><span class="chip"><i class="dot ${s === "needs" ? "needs" : "working"}"></i>${s === "needs" ? "需要你" : "正在干活"}</span><span class="sp"></span><span class="chip">${C.model} · ${C.effort}</span><span class="chip">ctx ${C.ctx}</span><span class="seg2"><span class="on">对话</span><span>终端</span></span></div>
      <div class="scroll"><div class="col">
        <div class="turn-user"><span class="av me">J</span><div><div class="who">你</div>${C.u1}</div></div>
        <div class="turn-user"><span class="av cl">✳</span><div class="md" style="flex:1"><div class="who">Claude</div><p>${C.a1}</p>
          <div class="think">${C.think}</div>
          <div class="fold"><span class="ch">▶</span>运行了 4 个步骤 · Bash ×3、Read ×1 <span class="kbd">· 2m 10s</span></div>
          ${C.a2}</div></div>
        <div class="turn-user"><span class="av me">J</span><div><div class="who">你 <span class="kbd">· 在它干活时发出</span></div>${C.u2}</div></div>
      </div></div>
      <div class="dock"><div class="col">
        ${s === "needs" ? approval() :
          `<div class="working"><span class="spark">✻</span>${C.working} <span class="kbd">${C.wdetail}</span><span class="sp"></span><span class="btn">停止 <span class="kbd">esc</span></span></div>`}
        <div class="field"><div class="ph">${s === "needs" ? "先回答上面的问题" : "给 Claude 发消息…"}</div><div class="tb"><span>/ 命令</span><span>＋ 图片</span><span class="sp"></span><span>⏎ 发送 · ⇧⏎ 换行</span></div></div>
      </div></div></div>`;
  },
  v3(s) {
    return rail() + `<div class="main"><div class="sheet"><div class="head"><span class="ttl">✳ ${C.title}</span><span class="sp"></span><span class="tabs"><span class="on">对话</span><span>终端</span></span></div>
      <div class="chips"><span class="chip"><i class="dot ${s === "needs" ? "needs" : "working"}"></i>${s === "needs" ? "需要你" : "正在干活"}</span><span class="chip">${C.model}</span><span class="chip">effort ${C.effort}</span><span class="chip">ctx ${C.ctx}</span><span class="chip">${C.cache}</span></div>
      <div class="scroll"><div class="col">
        <div class="user">${C.u1}</div>
        <div class="md"><p>${C.a1}</p></div>
        <div class="think">${C.think}</div>
        <div class="tl">${C.tools.map(t => `<div><b>${t[0]}</b>${t[1]}</div>`).join("")}</div>
        <div class="md">${C.a2}</div>
        <div class="user">${C.u2}</div><div class="queued">在它干活时发出</div>
      </div></div>
      <div class="dock"><div class="col">
        ${s === "needs" ? approval() :
          `<div class="working"><span class="spark">✻</span>${C.working}<span>${C.wdetail}</span><span class="sp"></span><span class="btn">Stop</span></div>`}
        <div class="field"><span class="ph">${s === "needs" ? "先回答上面的问题" : "给 Claude 发消息"}</span><span class="send">↑</span></div>
      </div></div></div></div>`;
  },
  v4(s) {
    return rail() + `<div class="main"><div class="head"><span class="ttl">✳ ${C.title}</span><span class="meta"><i class="dot ${s === "needs" ? "needs" : "working"}"></i>${s === "needs" ? "需要你" : "正在干活"} · ${C.model} · ctx ${C.ctx}</span><span class="right btn">终端</span></div>
      <div class="scroll"><div class="col">
        <div class="stamp">今天 19:54</div>
        <div class="b me">${C.u1}</div>
        <div class="b them">${C.a1}</div>
        <div class="pills">${C.tools.map(t => `<span class="pill"><span class="ok">✓</span> ${t[0]} · ${t[1].split(" ").slice(0, 4).join(" ")}…</span>`).join("")}</div>
        <div class="b them md">${C.a2}</div>
        <div class="b me">${C.u2}</div><div class="queued">在它干活时发出</div>
        ${s === "needs" ? "" : `<div class="typing"><span class="spark">✻</span>${C.working} ${C.wdetail}</div>`}
      </div></div>
      <div class="dock"><div class="col">
        ${s === "needs" ? approval() : ""}
        <div class="field">${s === "needs" ? "" : `<span class="btn">Stop</span>`}<span class="in">${s === "needs" ? "先回答上面的问题" : "iMessage 风格输入…"}</span><span class="send">↑</span></div>
      </div></div></div>`;
  },
  v5(s) {
    return rail() + `<div class="main"><div class="term"><div class="head"><span class="ttl">✳ ${C.title}</span><span>claude · ${C.model} · ${C.effort} · ctx ${C.ctx}</span><span class="sp"></span><span class="tg"><span class="on">chat</span><span>tty</span></span></div>
      <div class="scroll"><div class="col">
        <div class="u"><span class="p">❯</span><span class="tx">${C.u1}</span></div>
        <div class="a md"><p>${C.a1}</p></div>
        <div class="think">∴ ${C.think}</div>
        ${C.tools.map(t => `<div class="tool"><span class="ok">⏺</span> <b>${t[0]}</b>(${t[1]})</div>`).join("")}

        <div class="u"><span class="p">❯</span><span class="tx">${C.u2}</span><span style="color:var(--t-dim);font-size:11px">queued</span></div>
      </div></div>
      <div class="dock"><div class="col">
        ${s === "needs" ? approval() :
          `<div class="working">✻ ${C.working} <span class="dim">(${C.wdetail} · esc to interrupt)</span><span class="sp"></span><span class="btn">Stop</span></div>`}
        <div class="field"><span class="p">❯</span><span>${s === "needs" ? "先回答上面的问题" : "Message Claude"}</span></div>
        <div class="hint"><span>⏎ send</span><span>⇧⏎ newline</span><span>/ commands</span><span>⇧⌘\\ terminal</span></div>
      </div></div></div></div>`;
  },
};

let cur = 0, theme = "light", state = "working";
const ver = document.getElementById("ver");
VERSIONS.forEach((v, i) => {
  const b = document.createElement("button");
  b.textContent = v.name; b.onclick = () => { cur = i; draw(); };
  ver.appendChild(b);
});
function seg(id, set) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => {
    document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle("on", x === b));
    set(b.dataset.v); draw();
  });
}
seg("theme", v => theme = v);
seg("state", v => state = v);
function draw() {
  const v = VERSIONS[cur];
  [...ver.children].forEach((b, i) => b.classList.toggle("on", i === cur));
  const win = document.getElementById("win");
  win.parentElement.className = `desk ${v.id} ${theme}`;
  win.innerHTML = `<div class="lights"><i></i><i></i><i></i></div>` + R[v.id](state);
  document.getElementById("desc").innerHTML = v.desc;
}
document.addEventListener("keydown", e => { if (e.key >= "1" && e.key <= "5") { cur = +e.key - 1; draw(); } });
// #3-dark-needs opens version 3, dark, waiting on a question.
const h = location.hash.slice(1).split("-");
if (+h[0] >= 1 && +h[0] <= 5) cur = +h[0] - 1;
if (h.includes("dark")) document.querySelector('#theme [data-v="dark"]').click();
if (h.includes("needs")) document.querySelector('#state [data-v="needs"]').click();
draw();
</script>
</body>
</html>
