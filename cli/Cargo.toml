[package]
name = "attache-cli"
version = "0.3.17"
edition = "2021"
description = "The host side of Attaché: what the phone and the desktop read agents through"
publish = false

[[bin]]
name = "attache-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
# Mermaid diagrams for `mermaid`: layout (merman) and the PNG (resvg, which
# it brings). No C code in the tree, which is what keeps the musl builds
# linking with rust-lld alone. Fonts are read from files this program names,
# so merman's own system-font scan is left out.
#
# `layout-elk` is not optional, though it reads as if it were: it is the
# layout Mermaid 12's default look draws a flowchart with. Without it merman
# falls back to dagre and the edges come out as curves instead of the
# right-angled ones the owner chose (two builds compared 2026-11-15; 0.3.14
# to 0.3.16 shipped without it by mistake). `layout-cytoscape` is the one
# left out: only an architecture diagram asks for it.
merman = { version = "0.10.0", default-features = false, features = ["png", "native-fonts", "all-diagrams", "layout-elk"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
